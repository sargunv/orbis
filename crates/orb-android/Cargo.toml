[package]
name = "orb-android"
description = "The Android app: a map in a NativeActivity through orb-api and winit (cargo xtask android)"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
glam.workspace = true
orb-api.workspace = true
winit.workspace = true

# The entry point (src/android.rs): winit's NativeActivity backend, and JNI
# for the intent's extras (the jni that android-activity uses).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
winit = { workspace = true, features = ["android-native-activity"] }

[lints]
workspace = true
