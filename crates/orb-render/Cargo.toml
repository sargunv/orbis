[package]
name = "orb-render"
description = "The renderer: GPU scene tables and uploads, culling, passes and draws"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# The CPU frame driver and the tables' texture backing on the web (WebGL
# 2's build); natively they're always built (`build.rs`).
cpu-driven = []

[dependencies]
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
orb-crs.workspace = true
orb-hal.workspace = true
orb-layout.workspace = true
orb-shaders.workspace = true
rustc-hash.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Natively, wgpu makes shader modules from the build's naga modules.
orb-shaders = { workspace = true, features = ["ir"] }

[dev-dependencies]
orb-hal-wgpu.workspace = true
orb-host.workspace = true
orb-tile.workspace = true
pollster.workspace = true

[lints]
workspace = true
