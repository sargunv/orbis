[package]
name = "orb-hal-wgpu"
description = "orb-hal on wgpu: browser WebGPU or WebGL 2, Vulkan, Metal, D3D12 and GLES"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# On the web, the backend: exactly one of the two. `webgpu` is core.wasm's,
# `gl` core-gl.wasm's (WebGL 2). Natively, `gl` adds GLES over EGL beside
# the platform's own backend (Android always has it).
webgpu = ["wgpu/webgpu"]
gl = ["wgpu/webgl", "wgpu/gles"]

[dependencies]
futures-channel.workspace = true
orb-hal.workspace = true
wgpu.workspace = true


[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["HtmlVideoElement", "ImageBitmap"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Pipelines compile on the host's job threads.
orb-host.workspace = true
# Pipeline cache files carry a checksum (src/cache.rs).
sha2.workspace = true
# Compile threads pop wgpu's (immediately ready) error scopes.
pollster.workspace = true
# Shader modules from the build's naga modules (`ShaderModuleDesc::ir`).
naga = { workspace = true, features = ["deserialize"] }
postcard.workspace = true
wgpu = { workspace = true, features = ["naga-ir"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

# GLES for Android 11 and below, whose Vulkan Orbis can't use.
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

# D3D12 is on every Windows 10+ machine (VMs, Remote Desktop and WARP too);
# Vulkan there depends on the vendor's driver.
[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }
# Loads DXC's validator beside the compiler it picked (src/dx12.rs).
libloading.workspace = true


[dev-dependencies]
pollster.workspace = true

[lints]
workspace = true
