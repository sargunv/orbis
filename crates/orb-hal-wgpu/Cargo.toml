[package]
name = "orb-hal-wgpu"
description = "orb-hal on wgpu: browser WebGPU or WebGL 2, Vulkan, Metal, D3D12 and GLES"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# On the web, the backend: exactly one of the two. `webgpu` is core.wasm's,
# where the browser compiles the WGSL and wgpu wraps its pipelines; `gl`
# core-gl.wasm's (WebGL 2), which compiles the build's GLSL alone. Neither
# takes `wgpu/wgsl`. Natively, `gl` adds GLES over EGL beside the platform's
# own backend (Android always has it).
webgpu = ["wgpu/webgpu"]
gl = ["wgpu/webgl", "wgpu/gles", "dep:glow"]
# Vulkan beside Metal on Apple platforms (MoltenVK), for checking the Vulkan
# path under the validation layer there, and beside D3D12 on Windows, for
# checking a vendor's Vulkan driver; Linux and Android always have it.
vulkan = ["wgpu/vulkan-portability", "wgpu/vulkan"]
# Natively on macOS, GLES through ANGLE (`libEGL.dylib`, `libGLESv2.dylib`, which
# Chromium ships): WebGL 2's back end run outside a browser, `ORB_BACKEND=gl`.
angle = ["gl", "wgpu/angle"]

[dependencies]
futures-channel.workspace = true
# GL's error flag after a large texture (`try_create_texture`).
glow = { workspace = true, optional = true }
orb-hal.workspace = true
wgpu.workspace = true


[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
# WebGL 2's readbacks wait for their fence a task at a time.
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlVideoElement", "ImageBitmap"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Pipelines compile on the host's job threads.
orb-host.workspace = true
# Pipeline cache files carry a checksum (src/cache.rs).
sha2.workspace = true
# Compile threads pop wgpu's (immediately ready) error scopes.
pollster.workspace = true
# Shader modules from the build's naga modules (`ShaderModuleDesc::ir`), or
# its WGSL.
naga = { workspace = true, features = ["deserialize"] }
postcard.workspace = true
wgpu = { workspace = true, features = ["naga-ir", "wgsl"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
# A host's MTLTextures, drawn into in place (src/metal.rs); wgpu-hal's own.
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", default-features = false, features = [
  "std",
  "MTLAllocation",
  "MTLDevice",
  "MTLPixelFormat",
  "MTLResource",
  "MTLTexture",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }
# The Vulkan loader's version, for loaders that race on object names
# (src/offscreen.rs's `with_env`).
ash.workspace = true

# GLES for Android 11 and below, whose Vulkan Orbis can't use.
[target.'cfg(target_os = "android")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }
glow.workspace = true

# D3D12 is on every Windows 10+ machine (VMs, Remote Desktop and WARP too);
# Vulkan there depends on the vendor's driver.
[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }
# Loads DXC's validator beside the compiler it picked (src/dx12.rs).
libloading.workspace = true


[dev-dependencies]
pollster.workspace = true
# tests/leaks.rs hears the validation layer through wgpu-hal's log.
log.workspace = true

# examples/pipeline_probe.rs writes naga's SPIR-V as wgpu-hal does, from
# the device's robustness as wgpu-hal reads it, and its Metal Shading
# Language.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ash.workspace = true
naga = { workspace = true, features = ["msl-out", "spv-out"] }
# Its `--specialise`.
orb-shaders.workspace = true

[lints]
workspace = true
