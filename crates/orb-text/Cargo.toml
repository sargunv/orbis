[package]
name = "orb-text"
description = "Text: itemization, bidi, segmentation, glyph chain, advance shaping, line breaking and glyph SDFs"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = ["sea-dictionaries", "grapheme-data"]
# ICU4X's Thai, Lao, Khmer and Burmese dictionaries (≈1 MB), compiled in.
# The web asks the browser's `Intl.Segmenter` instead.
sea-dictionaries = [
  "dep:icu_provider",
  "icu_provider/sync",
  "dep:icu_segmenter",
]
# ICU4X's grapheme cluster rules in a web build, which otherwise asks the
# browser's `Intl.Segmenter` (`set_host_graphemes`). Native builds always
# compile them in.
grapheme-data = ["dep:icu_segmenter"]
# Glyphs from font bytes: HarfRust shaping, skrifa outlines, coverage
# (`font`). Native hosts link it; the web loads it as `shaper.wasm`.
fonts = ["dep:harfrust", "dep:skrifa", "dep:wuff", "dep:zeno"]

[dependencies]
rustc-hash.workspace = true
orb-wire.workspace = true
harfrust = { version = "0.15.0", default-features = false, features = [
  "std",
], optional = true }
icu_provider = { version = "2.4.0", default-features = false, optional = true }
icu_segmenter = { version = "2.4.0", default-features = false, optional = true, features = [
  "compiled_data",
] }
skrifa = { version = "0.49.0", default-features = false, features = [
  "std",
], optional = true }
zeno = { version = "0.3.3", default-features = false, features = [
  "eval",
  "std",
], optional = true }
wuff = { version = "0.2.9", optional = true }
unicode-bidi = { version = "0.3.18", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
icu_segmenter = { version = "2.4.0", default-features = false, features = [
  "compiled_data",
] }

[dev-dependencies]
miniz_oxide.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[lints]
workspace = true
