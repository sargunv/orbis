[package]
name = "orb-shaders"
description = "WGSL modules and their composition, and WebGL 2's stages written from them in GLSL"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# Each shader's naga module, parsed at build time (`Shader::ir`).
ir = ["dep:miniz_oxide"]
# WebGL 2's stages written as GLSL ES 3.00 at build time (`glsl`), which a GL
# device compiles as they are rather than translate WGSL on every load.
glsl = []

[dependencies]
miniz_oxide = { workspace = true, optional = true }

[build-dependencies]
miniz_oxide.workspace = true
naga = { workspace = true, features = ["serialize", "glsl-out"] }
postcard.workspace = true

[dev-dependencies]
# The stage hashes write Metal; the WebGL 2 dry run, GLSL ES 3.00; the
# Vulkan check, SPIR-V.
naga = { workspace = true, features = [
  "serialize",
  "deserialize",
  "msl-out",
  "glsl-out",
  "spv-out",
] }
postcard.workspace = true

[lints]
workspace = true
