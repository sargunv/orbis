[package]
name = "orb-shaders"
description = "WGSL modules and their composition"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# Each shader's naga module, parsed at build time (`Shader::ir`).
ir = ["dep:miniz_oxide"]

[dependencies]
miniz_oxide = { workspace = true, optional = true }

[build-dependencies]
miniz_oxide.workspace = true
naga = { workspace = true, features = ["serialize"] }
postcard.workspace = true

[dev-dependencies]
# The stage hashes write Metal; the WebGL 2 dry run, GLSL ES 3.00; the
# Vulkan check, SPIR-V.
naga = { workspace = true, features = [
  "serialize",
  "deserialize",
  "msl-out",
  "glsl-out",
  "spv-out",
] }
postcard.workspace = true

[lints]
workspace = true
