[package]
name = "orb-shaders"
description = "WGSL modules and their composition"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# The Compat programs: every Compat composition translated to GLSL ES 3.00
# by naga at build time (plan §8.4), for orb-hal-gl.
glsl = ["dep:naga", "dep:orb-hal"]

[dependencies]
orb-hal = { workspace = true, optional = true }

[build-dependencies]
naga = { workspace = true, optional = true, features = ["glsl-out"] }

[dev-dependencies]
naga = { workspace = true, features = ["glsl-out"] }

[lints]
workspace = true
