[package]
name = "orb-web"
description = "The browser build: core.wasm's wasm-bindgen surface and its host services (fetch, OPFS storage, image decoding, canvas glyphs)"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgpu"]
# The GPU backend, one of the two: core.wasm draws with WebGPU, core-gl.wasm
# (`--no-default-features --features gl`) with WebGL 2.
webgpu = ["orb-hal-wgpu/webgpu"]
gl = ["orb-hal-wgpu/gl", "orb-runtime/cpu-driven"]
# Panics say why on the console (`cargo xtask web --panics`): for debugging,
# at the cost of the formatting the shipped builds leave out.
panic-messages = []

[dependencies]
futures-channel.workspace = true
glam.workspace = true
js-sys.workspace = true
orb-camera.workspace = true
orb-crs.workspace = true
orb-expr.workspace = true
orb-hal.workspace = true
orb-hal-wgpu.workspace = true
orb-host.workspace = true
# `mbtiles://` sources, in their own module (`cargo xtask web`).
orb-runtime = { workspace = true, features = ["sqlite"] }
orb-symbol.workspace = true
orb-text.workspace = true
orb-tile.workspace = true
rustc-hash.workspace = true
# Event names and keys cross to the page every frame: interned, they're
# decoded once.
wasm-bindgen = { workspace = true, features = ["enable-interning"] }
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "console",
  "File",
  "FileSystemCreateWritableOptions",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemRemoveOptions",
  "FileSystemWritableFileStream",
  "Headers",
  "HtmlCanvasElement",
  "HtmlVideoElement",
  "ImageBitmap",
  "ImageData",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "Performance",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "RequestInit",
  "Response",
  "StorageManager",
  "TextMetrics",
  "Window",
  "WritableStream",
] }
wgpu.workspace = true

[dev-dependencies]
orb-style.workspace = true

[lints]
workspace = true
