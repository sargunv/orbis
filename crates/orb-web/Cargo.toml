[package]
name = "orb-web"
description = "The browser build: core.wasm's wasm-bindgen surface and its host services (fetch, OPFS storage, image decoding, canvas glyphs)"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-channel.workspace = true
glam.workspace = true
js-sys.workspace = true
orb-camera.workspace = true
orb-crs.workspace = true
orb-expr.workspace = true
orb-hal.workspace = true
orb-interact.workspace = true
orb-hal-wgpu.workspace = true
orb-host.workspace = true
orb-runtime.workspace = true
orb-symbol.workspace = true
orb-text.workspace = true
orb-tile.workspace = true
orb-style.workspace = true
# Event names and keys cross to the page every frame: interned, they're
# decoded once.
wasm-bindgen = { workspace = true, features = ["enable-interning"] }
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "File",
    "FileSystemCreateWritableOptions",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "Headers",
    "HtmlCanvasElement",
    "HtmlVideoElement",
    "ImageBitmap",
    "ImageData",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestInit",
    "Response",
    "StorageManager",
    "TextMetrics",
    "Window",
    "WritableStream",
] }
wgpu.workspace = true

[lints]
workspace = true
