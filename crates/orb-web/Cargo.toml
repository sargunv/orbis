[package]
name = "orb-web"
description = "The browser build: core.wasm's wasm-bindgen surface"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["modern"]
# WebGPU through wgpu: the Modern tier, `core.wasm`.
modern = ["dep:orb-hal-wgpu", "dep:wgpu"]
# WebGL2 through orb-hal-gl: the Compat tier, `compat.wasm` (plan §8.7).
compat = ["dep:orb-hal-gl", "orb-runtime/compat"]
# The test harness entry points, built into `harness.wasm` and never into
# `core.wasm`: the render submissions bench (web/demo/bench.html) and the
# render fixture driver (`cargo xtask rt --platform chrome`), on either
# tier.
harness = [
  "modern",
  "compat",
  "dep:orb-bench",
  "orb-host/fonts",
  "orb-text/fonts",
  "web-sys/Document",
]

[dependencies]
futures-channel.workspace = true
glam.workspace = true
js-sys.workspace = true
orb-bench = { workspace = true, optional = true }
orb-camera.workspace = true
orb-crs.workspace = true
orb-expr.workspace = true
orb-hal.workspace = true
orb-interact.workspace = true
orb-hal-gl = { workspace = true, optional = true }
orb-hal-wgpu = { workspace = true, optional = true }
orb-host.workspace = true
orb-host-web.workspace = true
orb-jobs.workspace = true
orb-runtime.workspace = true
orb-symbol.workspace = true
orb-text.workspace = true
orb-tile.workspace = true
orb-style.workspace = true
orb-v8.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "HtmlVideoElement", "ImageBitmap", "OffscreenCanvas", "Window"] }
wgpu = { workspace = true, optional = true }

[lints]
workspace = true
