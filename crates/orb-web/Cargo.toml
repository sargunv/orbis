[package]
name = "orb-web"
description = "The browser build: core.wasm's wasm-bindgen surface"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The test harness entry points, built into `harness.wasm` and never into
# `core.wasm`: the render submissions bench (web/demo/bench.html) and the
# render fixture driver (`cargo xtask rt --platform chrome`).
harness = ["dep:orb-bench", "orb-host/fonts", "orb-text/fonts"]

[dependencies]
futures-channel.workspace = true
glam.workspace = true
js-sys.workspace = true
orb-bench = { workspace = true, optional = true }
orb-camera.workspace = true
orb-crs.workspace = true
orb-expr.workspace = true
orb-geo.workspace = true
orb-hal.workspace = true
orb-interact.workspace = true
orb-hal-wgpu.workspace = true
orb-host.workspace = true
orb-host-web.workspace = true
orb-jobs.workspace = true
orb-runtime.workspace = true
orb-symbol.workspace = true
orb-text.workspace = true
orb-tile.workspace = true
orb-v8.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "ImageBitmap", "OffscreenCanvas", "Window"] }
wgpu.workspace = true

[lints]
workspace = true
