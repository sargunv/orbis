[package]
name = "orb-runtime"
description = "Runtime and Map: style, camera, sources, jobs and frames"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# The CPU frame driver and the tables' texture backing on the web
# (`orb-render`'s `cpu-driven`), for WebGL 2.
cpu-driven = ["orb-render/cpu-driven"]
# SQLite files, read by orb-sqlite: `mbtiles://` sources, and MapLibre
# Native's offline databases merged into a runtime's regions.
sqlite = ["dep:orb-sqlite", "dep:miniz_oxide", "orb-source/mbtiles"]

[dependencies]
rustc-hash.workspace = true
orb-wire.workspace = true
bytemuck.workspace = true
glam.workspace = true
orb-camera.workspace = true
orb-crs.workspace = true
orb-expr.workspace = true
orb-hal.workspace = true
orb-host.workspace = true
orb-layout.workspace = true
orb-render.workspace = true
orb-shaders.workspace = true
orb-source.workspace = true
orb-sqlite = { workspace = true, optional = true }
# Native's compressed bodies.
miniz_oxide = { workspace = true, optional = true }
orb-style.workspace = true
orb-symbol.workspace = true
orb-text.workspace = true
orb-tile.workspace = true

# Native builds compile the Southeast Asian word data in; the web asks the
# browser's segmenter.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orb-text = { workspace = true, features = ["sea-dictionaries"] }

[dev-dependencies]
orb-host-native.workspace = true
orb-hal-wgpu.workspace = true
# The graphics API's validation errors, which wgpu-hal logs.
log.workspace = true
png.workspace = true
pollster.workspace = true
# Writes the MBTiles archives the loader's tests read.
rusqlite.workspace = true
# GL JS golden vectors hold shortest round-trip doubles; parse them exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
