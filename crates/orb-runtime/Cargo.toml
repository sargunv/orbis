[package]
name = "orb-runtime"
description = "Runtime and Map: style, camera, sources, jobs and frames"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# Renders on Compat devices too (plan §8.7).
compat = ["orb-render/compat"]

[dependencies]
bytemuck.workspace = true
glam.workspace = true
orb-camera.workspace = true
orb-crs.workspace = true
orb-expr.workspace = true
orb-hal.workspace = true
orb-host = { workspace = true, features = ["decode"] }
orb-jobs.workspace = true
orb-layout.workspace = true
orb-render.workspace = true
orb-source.workspace = true
orb-style.workspace = true
orb-a11y.workspace = true
orb-symbol.workspace = true
orb-text = { workspace = true, features = ["sea-buffer"] }
orb-tile.workspace = true
orb-v8.workspace = true

# Native builds compile the Southeast Asian word data in; the web loads it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
orb-text = { workspace = true, features = ["sea-dictionaries"] }

[dev-dependencies]
orb-text = { workspace = true, features = ["sea-export"] }
orb-hal-wgpu.workspace = true
pollster.workspace = true
# GL JS golden vectors hold shortest round-trip doubles; parse them exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
