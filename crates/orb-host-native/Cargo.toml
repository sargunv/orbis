[package]
name = "orb-host-native"
description = "Host services on native platforms: HTTP via ureq, files"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
fontdb = "0.24.0"
# JPEG for raster imagery; the core decodes PNG and WebP (`orb_host::decode_image`).
image = { workspace = true, features = ["jpeg"] }
orb-host = { workspace = true, features = ["decode", "fonts"] }
orb-jobs.workspace = true
orb-text = { workspace = true, features = ["fonts"] }
ureq.workspace = true

[lints]
workspace = true
