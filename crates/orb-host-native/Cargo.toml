[package]
name = "orb-host-native"
description = "Host services on native platforms: HTTP via ureq, or HttpURLConnection on Android, files, system fonts (through the system's own fallbacks on Apple platforms, Android, Windows and Linux), and locale expressions through the system ICU"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
# On Android, HTTP also in a process no app started, which has no JVM to
# fetch through (orb-bench pushed with adb): ureq over rustls, trusting the
# system store's certificate files. Apps leave it off, so ureq, rustls and
# ring stay out of their library. Elsewhere ureq is HTTP's only way.
standalone = ["dep:rustls", "dep:ureq"]

[dependencies]
fontdb = "0.24.0"
image = { workspace = true, features = ["jpeg"] }
orb-expr.workspace = true
orb-host = { workspace = true, features = ["fonts"] }
orb-text = { workspace = true, features = ["fonts"] }

# HTTPS over rustls with ring, verifying servers as the platform does
# (rustls-platform-verifier: its trust store, settings and revocation).
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
ureq = { workspace = true, features = [
  "rustls-no-provider",
  "platform-verifier",
] }

# Locale expressions load the system ICU at run time (`locale`), and local
# fonts fall back through fontconfig, loaded at run time, on Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# The user's locale and languages, and CoreText's fallback fonts.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "CFArray",
  "CFData",
  "CFDictionary",
  "CFLocale",
  "CFNumber",
  "CFString",
  "CFURL",
  "std",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
  "CTFont",
  "CTFontDescriptor",
  "CTFontTraits",
] }

# DirectWrite's system font fallback. wgpu's D3D12 back end already
# builds this crate; its Win32 features stay as they are.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite"] }
windows-core = "0.62.2"

# On Android HTTP goes through the app's HttpURLConnection, and locale
# expressions through android.icu, in the JVM the app hands in
# (`android::init`), which also gives the app's assets (ndk's asset
# manager) and its languages, for the NDK's font matcher.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk = { version = "0.9.0", default-features = false }
ndk-sys = "0.6.0"
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
], optional = true }
ureq = { workspace = true, features = ["rustls-no-provider"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
