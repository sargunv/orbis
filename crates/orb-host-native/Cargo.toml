[package]
name = "orb-host-native"
description = "Host services on native platforms: HTTP via ureq, files"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
fontdb = "0.24.0"
image = { workspace = true, features = ["jpeg"] }
orb-host = { workspace = true, features = ["fonts"] }
orb-text = { workspace = true, features = ["fonts"] }
# HTTPS over rustls with ring, verifying servers as the platform does
# (rustls-platform-verifier: its trust store, settings and revocation).
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
ureq = { workspace = true, features = [
  "rustls-no-provider",
  "platform-verifier",
] }

# On Android the verifier calls the app's JVM, which the app hands in
# (`android::init`), as do the network security config and the app's
# assets (ndk's asset manager); until then HTTPS trusts the system store's
# certificate files.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk = { version = "0.9.0", default-features = false }
ndk-sys = "0.6.0"
rustls-platform-verifier = "0.7.1"

[lints]
workspace = true
