[package]
name = "orb-bench"
description = "Native benchmarks through orb-api: frame timings, tile jobs' stages, stutter paths by stage, and pnpm session's native twin"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
glam.workspace = true
orb-api.workspace = true
orb-camera.workspace = true
orb-crs.workspace = true
orb-host-native.workspace = true
orb-runtime.workspace = true
orb-source.workspace = true
orb-style.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Pushed to a phone with adb, it runs with no JVM to fetch through.
[target.'cfg(target_os = "android")'.dependencies]
orb-host-native = { workspace = true, features = ["standalone"] }

[lints]
workspace = true
