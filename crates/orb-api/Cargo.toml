[package]
name = "orb-api"
description = "The Rust embedding API for native hosts: runtime, maps, targets, frames and events"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[features]
default = ["sqlite"]
# SQLite files: `mbtiles://` sources, and MapLibre Native's offline
# databases merged into the runtime's regions (`Runtime::merge_regions`).
sqlite = ["orb-runtime/sqlite"]

[dependencies]
glam.workspace = true
orb-camera.workspace = true
orb-crs.workspace = true
orb-hal.workspace = true
orb-hal-wgpu.workspace = true
orb-host.workspace = true
orb-host-native.workspace = true
orb-runtime.workspace = true
pollster.workspace = true

[dev-dependencies]
png.workspace = true
# Writes the MapLibre Native offline database the merge test reads.
rusqlite.workspace = true
miniz_oxide.workspace = true

[lints]
workspace = true
