[package]
name = "orb-symbol"
description = "Symbol layout: anchors, glyph and icon quads, collision features and stable keys"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
serde.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
glam.workspace = true
orb-crs.workspace = true
orb-text.workspace = true
orb-tile.workspace = true

[dev-dependencies]
# Golden vectors hold shortest round-trip doubles; parse them exactly.
serde_json = { workspace = true, features = ["float_roundtrip"] }

# wasm's std carries the same code (`math`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libm.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[lints]
workspace = true
