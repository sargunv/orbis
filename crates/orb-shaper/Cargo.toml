[package]
name = "orb-shaper"
description = "shaper.wasm: font-faces files drawn with HarfRust and skrifa, loaded lazily by the web's job workers"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
orb-text = { workspace = true, default-features = false, features = ["fonts"] }
wasm-bindgen.workspace = true

[lints]
workspace = true
