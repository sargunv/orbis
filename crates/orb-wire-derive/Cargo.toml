[package]
name = "orb-wire-derive"
description = "orb-wire's derive: a message's fields in declaration order, an enum's variant by its index"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", default-features = false, features = [
  "derive",
  "parsing",
  "printing",
  "proc-macro",
] }

[lints]
workspace = true
