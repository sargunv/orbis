# mln-rs's side of `cargo xtask h2h`: the same stills, tiles and nudged
# frames as `orbis` and `orb-bench` time, through mln-rs (a Rust port of
# MapLibre Native) at a pinned commit. Its own workspace: xtask builds it
# into the h2h cache's target directory, apart from Orbis's.
[package]
name = "mln-h2h"
version = "0.0.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
mln-rs = { git = "https://github.com/louwers/mln-rs", rev = "26d7630c743156d8b64acd70e5cdd729bca6ee3d" }

# Process CPU time: `clock_gettime` on Unix, `GetProcessTimes` on Windows.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = [
  "std",
  "time",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[workspace]

# Orbis's `dist` profile, for a like-for-like binary size.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
