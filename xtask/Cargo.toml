[package]
name = "xtask"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
orb-crs.workspace = true
orb-host.workspace = true
orb-source.workspace = true
orb-style.workspace = true
orb-text.workspace = true
orb-tile.workspace = true
# Typed staging preserves wire types; tooling only, pinned to this API.
mlt-core = { version = "=0.22.1", default-features = false, features = [
  "__private",
] }
brotli.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
ureq = { workspace = true, features = ["rustls"] }
rusqlite.workspace = true
flate2.workspace = true
png.workspace = true
tar.workspace = true
sha2.workspace = true
base64.workspace = true
wasmparser.workspace = true
# Function names in the linked core.wasm, as wasm-bindgen writes them (data.rs).
rustc-demangle = "0.1.28"
# orb-ffi's declarations from the mirrored C headers (`mln-ffi declarations`):
# bindgen loads libclang when it runs, so building xtask needs none.
bindgen = { version = "0.73.2", default-features = false, features = [
  "runtime",
  "prettyplease",
] }
syn = { version = "2.0.119", features = ["full"] }
quote = "1.0.47"

# A child's CPU and peak memory for `h2h`, where there's no `/usr/bin/time`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[lints]
workspace = true
