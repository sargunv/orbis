<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbis · Style playground</title>
<style>
:root{font-family:"Avenir Next",Avenir,sans-serif;color:#243c50;background:#edf2f5;font-size:15px}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:baseline;gap:24px;padding:16px 24px;background:#dce7ef}h1{font-size:24px;letter-spacing:-.7px;margin:0}header p{margin:0}a{color:#315f80}main{display:grid;grid-template-columns:minmax(300px,36%) 1fr;flex:1;min-height:0}.editor{display:flex;flex-direction:column;gap:12px;padding:20px}label{font-weight:600}textarea{resize:none;flex:1;min-height:180px;width:100%;border:1px solid #9eb2c2;border-radius:5px;background:#fbfdff;padding:14px;font:13px/1.6 "SFMono-Regular",Consolas,monospace;color:#243c50;tab-size:2}textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #e75f35;outline-offset:3px}.map{position:relative;min-height:300px}#map{width:100%;height:100%}#hud{position:absolute;bottom:0;left:0;right:0;padding:12px;background:#edf2f5e8;font:12px/1.6 monospace;white-space:pre-wrap;pointer-events:none}#error{color:#a32d1a;white-space:pre-wrap;overflow-wrap:anywhere;max-height:120px;overflow:auto}#edit-status,#hover{min-height:1.4em;font-size:13px}button{align-self:flex-start;font:inherit;background:#315f80;color:white;border:0;border-radius:4px;padding:8px 14px;cursor:pointer}.hint{font-size:13px;line-height:1.5;margin:0}#native{font-size:13px;margin:0} @media(max-width:720px){body{height:auto;min-height:100dvh}header{display:block}header p{margin-top:8px}main{display:flex;flex-direction:column}.editor{height:50dvh}.map{height:60dvh}}
</style></head>
<body><header><h1>Orbis / Style playground</h1><p>Edit the map as it draws.</p><a href="./">Map viewer</a><p>%ORBIS_COMMIT%</p></header>
<main><section class="editor"><label for="style">Style JSON</label><p class="hint">Changes apply as you type. Hover over a block, route or station to highlight it.</p><textarea id="style" wrap="off" spellcheck="false" aria-describedby="error" aria-label="Style JSON"></textarea><div id="error" role="alert"></div><div id="edit-status" role="status">Loading style…</div><button id="reset">Reset style</button><p id="native">Native link available with the local development server.</p></section><section class="map" aria-label="Interactive map"><div id="map" aria-label="Map; drag to pan and scroll to zoom"></div><div id="hud"></div><output id="hover" style="position:absolute;top:12px;left:12px;background:#edf2f5e8;padding:8px">Hover to inspect a feature</output></section></main>
<script type="module" src="./playground.js"></script></body></html>
