<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbis</title>
<!-- The style playground is now the map app's style editor. -->
<script>
  const query = new URLSearchParams(location.search);
  query.set("edit", "");
  location.replace(`./?${query.toString().replace(/=(?=&|$)/g, "")}${location.hash}`);
</script>
</head>
<body><p>The style playground moved into <a href="./?edit">the map's style editor</a>.</p></body>
</html>
