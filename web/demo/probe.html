<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbis · WebGPU probe</title>
<style>
  body { font: 14px/1.5 ui-monospace, monospace; margin: 16px; max-width: 48em; }
  pre { white-space: pre-wrap; background: #f4f4f0; padding: 12px; border-radius: 6px; }
  button { font: inherit; padding: 4px 12px; }
</style>
<h1>WebGPU probe</h1>
<p>Checks what Orbis's web roles need: WebGPU on the page and in a dedicated
worker, and OffscreenCanvas. Copy the result into the issue.</p>
<pre id="out">probing…</pre>
<button id="copy">Copy</button>
<script type="module">
import { adapterInfo } from "./gpu-probe.js";

const worker = new Worker(new URL("./probe-worker.js", import.meta.url), { type: "module" });
const inWorker = await new Promise((resolve) => {
  worker.onmessage = (e) => resolve(e.data);
  worker.onerror = (e) => resolve({ error: e.message });
  worker.postMessage(null);
  setTimeout(() => resolve({ error: "timeout" }), 10000);
});
worker.terminate();
const canvas = document.createElement("canvas");
const result = {
  userAgent: navigator.userAgent,
  page: await adapterInfo(navigator.gpu),
  worker: inWorker,
  transferControlToOffscreen: typeof canvas.transferControlToOffscreen === "function",
  hardwareConcurrency: navigator.hardwareConcurrency,
  devicePixelRatio,
};
const text = JSON.stringify(result, null, 2);
document.getElementById("out").textContent = text;
document.getElementById("copy").onclick = () => navigator.clipboard.writeText(text);
</script>
</html>
