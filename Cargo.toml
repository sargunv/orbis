[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
publish = false
version = "0.0.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
ash = { version = "0.38.0", default-features = false, features = ["loaded"] }
mlt-core = { version = "0.22.1", default-features = false }
brotli = "9.1.1"
bitflags = "2.13.2"
earcut = "0.4.12"
bytemuck = "1.25.2"
rustc-hash = "2.1.3"
js-sys = "0.3.107"
libm = "0.2.16"
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "webp",
] }
glam = { version = "0.34.2", default-features = false, features = [
  "std",
  "f64",
  "serde",
] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
png = "0.18.1"
pollster = "1.0.1"
libloading = "0.8.9"
# wgpu-hal's reports, which the validation test reads.
log = "0.4.35"
# Process CPU time for the bench tools (orb-bench, orb-cli).
rustix = { version = "1.1.6", default-features = false, features = [
  "std",
  "time",
] }
ureq = "3.5.1"
# Reads MapLibre Native's render-test cache (cargo xtask fixtures native).
rusqlite = { version = "0.41.1", features = ["bundled"] }
flate2 = "1.1"
miniz_oxide = { version = "0.9.1", features = ["with-alloc"] }
futures-channel = "0.3"
tar = "0.4"
sha2 = "0.11.1"
wasmparser = { version = "0.263.0", default-features = false, features = [
  "std",
  "simd",
] }
base64 = "0.23.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = [
  "std",
  "derive",
  "rc",
] }
serde_json = "1.0.154"
winit = "0.30.13"
# The native demo's UI, on the same wgpu device as its map.
egui = { version = "0.37.0", default-features = false, features = [
  "default_fonts",
] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = [
  "accesskit",
  "wayland",
  "x11",
] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
wgpu = { version = "30.0.1", default-features = false, features = [
  "wgsl",
  "std",
  "parking_lot",
] }

orb-api = { path = "crates/orb-api" }
orb-camera = { path = "crates/orb-camera" }
orb-crs = { path = "crates/orb-crs" }
orb-expr = { path = "crates/orb-expr" }
orb-hal = { path = "crates/orb-hal" }
orb-hal-wgpu = { path = "crates/orb-hal-wgpu" }
orb-host = { path = "crates/orb-host" }
orb-host-native = { path = "crates/orb-host-native" }
orb-layout = { path = "crates/orb-layout" }
orb-render = { path = "crates/orb-render" }
orb-runtime = { path = "crates/orb-runtime" }
orb-shaders = { path = "crates/orb-shaders" }
orb-source = { path = "crates/orb-source" }
orb-symbol = { path = "crates/orb-symbol" }
orb-text = { path = "crates/orb-text", default-features = false }
orb-style = { path = "crates/orb-style" }
orb-tile = { path = "crates/orb-tile" }
orb-web = { path = "crates/orb-web" }

[patch.crates-io]
# wgpu 30.0.1 with D3D12 render passes (BeginRenderPass), off unless
# `WGPU_DX12_RENDER_PASSES=1`: on the Adreno X1, the tiler they were for,
# they made the multisampled 3D pass slower, not faster (#164).
# The same branch carries naga's SPIR-V fixes: no explicit layout on
# Function, Private and Workgroup variables (VUID-StandaloneSpirv-None-10684,
# gfx-rs/wgpu#7696), and a u32 one clamping u32 image coordinates; orb-shaders'
# `spirv_validates_for_vulkan` checks every stage. And wgpu-core's tracker
# starting a command buffer's untracked mip levels in the state a compute
# pass first needs them in (the drape's mips, VUID-vkCmdDraw-None-09600,
# #170), and MoltenVK fixes: naga's workgroup zeroing, and twin types named
# apart. orb-runtime's `validation` test checks the scenes under Vulkan's
# validation layer. And GLES uploading an `ImageBitmap` with the default
# unpack layout, not the last buffer copy's, which sheared raster and DEM
# tiles on WebGL 2 or (Firefox) dropped them (gfx-rs/wgpu#8668). And GLES
# and GL 4.3 restarting strips at the fixed index, as WebGPU and WebGL 2 do
# (`PRIMITIVE_RESTART_FIXED_INDEX`, never enabled): without it ANGLE dropped
# draws holding hidden slots. And a D3D12 pipeline cache: DXC's (or FXC's)
# output by a SHA-256 of the compiler, its arguments and the HLSL, which
# the runtime keeps in its state directory as it keeps Vulkan's (#141).
# Every crate of wgpu's workspace comes from the fork, since its path
# dependencies resolve there. #35 tracks sending it upstream.
naga = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
naga-types = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu-core = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu-core-deps-apple = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu-core-deps-emscripten = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu-core-deps-wasm = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu-hal = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu-naga-bridge = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
wgpu-types = { git = "https://github.com/sargunv/wgpu", branch = "dx12-render-passes" }
# One copy of the scalar unpack kernels instead of three: 7 KiB brotli off
# core.wasm, no measurable tile decode cost (#35 tracks sending it upstream).
fastpfor = { git = "https://github.com/sargunv/FastPFOR-rs", branch = "scalar-unpack-not-inline" }
# geo 0.33.1 (through mlt-core) pins earcut =0.4.5, and Cargo allows one 0.4.x
# in a graph. 0.4.12 bridges holes through a block index, several times
# faster on polygons with many holes. Upstream unpinned it after 0.33.1
# (georust/geo#1533); drop this with the next geo release.
geo = { git = "https://github.com/sargunv/geo", branch = "unpin-earcut-0.33.1" }

# Several agents build at once on one disk: line tables keep backtraces
# readable at a fraction of full debug info, and dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The web build: smallest code, one codegen unit, whole-program LTO.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# What ships natively (the Android app, h2h's size table): small and
# whole-program optimized; panics abort.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
